<section class="section">
  <h2 class="section-title">{{ 'skills.title' | translate }}</h2>
  <p class="section-subtitle">{{ 'skills.subtitle' | translate }}</p>

  <div class="skills-grid">
    <div class="skill-card" *ngFor="let group of groups">
      <h3 class="skill-card__title">
        <span>{{ group.icon }}</span> {{ group.label }}
      </h3>
      <div class="skill-card__chips">
        <span class="chip" *ngFor="let skill of group.skills">{{ skill }}</span>
      </div>
    </div>
  </div>
</section>
